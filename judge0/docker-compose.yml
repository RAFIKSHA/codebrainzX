version: '2.4'

services:
  server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    env_file: judge0.conf
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "docker-entrypoint.sh --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file: judge0.conf
    restart: always
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
